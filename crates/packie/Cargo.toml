[package]
name = "packie"
description = "Positive ACK engine host and command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "packie"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
packie-audit = { path = "../packie-audit" }
packie-backup = { path = "../packie-backup" }
packie-config = { workspace = true }
packie-core = { workspace = true }
packie-diagnostics = { workspace = true }
packie-engine = { workspace = true }
packie-host = { workspace = true }
packie-ipc = { workspace = true }
packie-routing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
