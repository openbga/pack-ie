[package]
name = "packie-config"
description = "Bootstrap and runtime configuration models, validation, versioning and persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-float"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, features = ["serde-json-impl"] }
packie-core = { workspace = true }
# Filters and mappings are compiled against the protocol models when a document is validated.
packie-transform = { path = "../packie-transform" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
