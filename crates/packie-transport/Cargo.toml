[package]
name = "packie-transport"
description = "Endpoint transports: TCP client and listener, serial (physical and virtual), folder, SFTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
notify = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
serde_json = { workspace = true }
serialport = { workspace = true }
socket2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
packie-config = { workspace = true }
packie-core = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for writes that must not follow links.
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
