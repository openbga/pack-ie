# cargo-deny: dependency licenses must be AGPL-3.0-compatible; advisories fail the build.
# Checked for both graphs: the workspace, and console/src-tauri with
# `cargo deny --manifest-path console/src-tauri/Cargo.toml --config deny.toml check`
# (CI runs both).

[graph]
all-features = true

[advisories]
yanked = "deny"
# Maintenance notices without a drop-in replacement, reviewed 2026-11-06. None is a
# vulnerability; revisit when the parent crates move on.
ignore = [
  # zbus folded these into zbus itself; zbus 5.19 (via keyring's Linux secret-service store)
  # still depends on the standalone crates and no released zbus avoids them.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: via zbus 5 <- secret-service <- keyring (Linux key store); no zbus release without it" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: via zbus 5 <- secret-service <- keyring (Linux key store); no zbus release without it" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via zbus 5 <- secret-service <- keyring (Linux key store); no zbus release without it" },
  # Console graph only: gtk-rs 0.18 (Tauri 2's Linux webview stack) uses this proc macro at
  # build time; Tauri has not moved to newer gtk-rs.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro of gtk-rs 0.18 under Tauri 2 on Linux (console graph only)" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "AGPL-3.0-only",
  "GPL-3.0",
  "GPL-3.0-only",
  "LGPL-3.0",
  "MIT",
  "MIT-0",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
